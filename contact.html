<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Anfas Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons (CDN) -->

</head>



<body>

    <script src="https://unpkg.com/lucide@latest"></script>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>
    <div class="grain-overlay"></div>
    <div class="content-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="container header-content">
                <div class="logo">ANFAS.</div>
                <nav class="nav-container">
                    <ul class="nav-menu">
                        <li>
                            <a href="index.html#home" aria-label="Home">
                                <span class="desktop-text">Home</span>
                                <i data-lucide="home" class="mobile-icon"></i>
                            </a>
                        </li>
                        <li>
                            <a href="index.html#about" aria-label="About">
                                <span class="desktop-text">About</span>
                                <i data-lucide="user" class="mobile-icon"></i>
                            </a>
                        </li>
                        <li>
                            <a href="index.html#service" aria-label="Services">
                                <span class="desktop-text">Service</span>
                                <i data-lucide="briefcase" class="mobile-icon"></i>
                            </a>
                        </li>
                        <li>
                            <a href="contact.html" class="active" aria-label="Contact">
                                <span class="desktop-text">Contact</span>
                                <i data-lucide="mail" class="mobile-icon"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="header-actions">
                    <a href="contact.html" class="btn btn-outline">Hire Me</a>
                    <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
                        <span class="hamburger-box">
                            <span class="hamburger-inner"></span>
                        </span>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <div style="padding-top: 150px;"></div>
            <!-- Contact Section -->
            <section id="contact" class="contact">
                <div class="container">
                    <div class="section-header">
                        <span class="section-subtitle">GET IN TOUCH</span>
                        <h2>Let's discuss your project</h2>
                    </div>
                    <div class="contact-grid">
                        <div class="contact-info">
                            <div class="contact-visual">
                                <div class="sphere-container">
                                    <div class="sphere"></div>
                                    <div class="sphere-glow"></div>
                                    <div class="sphere-text">Let's Connect</div>
                                </div>
                            </div>
                            <div class="info-card">
                                <div class="icon-box"><i data-lucide="mail"></i></div>
                                <div>
                                    <h4>Email</h4>
                                    <p>kanfas888@gmail.com</p>
                                </div>
                            </div>
                            <div class="info-card">
                                <div class="icon-box"><i data-lucide="phone"></i></div>
                                <div>
                                    <h4>Phone</h4>
                                    <p>+91 8590468094</p>
                                </div>
                            </div>
                            <div class="info-card">
                                <div class="icon-box"><i data-lucide="map-pin"></i></div>
                                <div>
                                    <h4>Location</h4>
                                    <p>India</p>
                                </div>
                            </div>
                        </div>
                        <form id="contactForm" class="contact-form">
                            <div class="form-group">
                                <input type="text" id="name" placeholder="Name" required>
                            </div>

                            <div class="form-group">
                                <input type="email" id="email" placeholder="Email" required>
                            </div>

                            <div class="form-group">
                                <input type="text" id="subject" placeholder="Subject">
                            </div>

                            <div class="form-group">
                                <textarea id="message" placeholder="Message" rows="5" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary whatsapp-btn">
                                <span class="icon-wrapper">
                                    <i data-lucide="message-circle" class="icon-default"></i>
                                    <i data-lucide="whatsapp" class="icon-hover"></i>
                                </span>
                                <span>Let's Talk</span>
                            </button>



                            <p id="formStatus" class="form-status"></p>
                        </form>

                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Footer -->
    <footer class="footer-premium-studio" id="footer">
        <div class="footer-noise"></div>

        <!-- Parallax Background Text -->
        <div class="footer-parallax-text">
            <span>LET'S TALK</span>
        </div>

        <div class="container footer-content-wrapper">
            <!-- Main CTA Area -->
            <div class="footer-main-cta">
                <span class="footer-label">HAVE A PROJECT IN MIND?</span>
                <a href="contact.html" class="studio-cta-link magnetic-btn">
                    <span class="btn-text" data-text="START A PROJECT">START A PROJECT</span>
                    <span class="btn-icon"><i data-lucide="arrow-up-right"></i></span>
                </a>
            </div>

            <!-- Bottom Bar -->
            <div class="footer-bottom-bar">
                <div class="f-left">
                    <span class="copyright">© 2026 ANFAS.</span>
                </div>

                <div class="f-center">
                    <a href="#" id="backToTop" class="back-to-top">
                        <span>BACK TO TOP</span>
                        <div class="icon-circle"><i data-lucide="arrow-up"></i></div>
                    </a>
                </div>

                <div class="f-right">
                    <div class="social-links-studio">
                        <a href="https://wa.me/919876543210" aria-label="WhatsApp"><i
                                data-lucide="message-circle"></i></a>
                        <a href="#" aria-label="Instagram"><i data-lucide="instagram"></i></a>
                        <a href="#" aria-label="LinkedIn"><i data-lucide="linkedin"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Lenis Smooth Scroll -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
